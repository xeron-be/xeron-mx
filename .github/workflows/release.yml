name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (leave empty for an edge build)"
        type: string
        required: false
        default: ""
      prerelease:
        description: "Publish it as a pre-release (the image does not become :latest)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.version || 'edge' }}
  cancel-in-progress: ${{ !inputs.version }}

jobs:
  prepare:
    name: Decide what to publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      label: ${{ steps.plan.outputs.label }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      image: ${{ steps.plan.outputs.image }}
      images: ${{ steps.plan.outputs.images }}
      date: ${{ steps.plan.outputs.date }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$GITHUB_REF" = "refs/heads/main" ] ||
            fail "Releases are built from main only; this run is on $GITHUB_REF."

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          VERSION="$(echo "${VERSION#v}" | xargs)"

          if [ -z "$VERSION" ]; then
            kind=edge
            tag=edge
            label=edge
            prerelease=true
            images="$image:edge"$'\n'"$image:sha-$short"
            {
              echo "Automatic build of \`main\` at $GITHUB_SHA."
              echo
              echo "This is not a release. It is replaced by the next push to \`main\`;"
              echo "for production, use the newest versioned release and \`$image:latest\`."
              echo
              echo "Docker image: \`$image:edge\` (or \`$image:sha-$short\` to pin this build)."
            } > notes.md
          else
            [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
              fail "\"$VERSION\" is not a version: expected MAJOR.MINOR.PATCH, optionally -suffix."

            kind=official
            tag="v$VERSION"
            label="$tag"
            prerelease="$PRERELEASE"
            [[ "$VERSION" == *-* ]] && prerelease=true

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              fail "The tag $tag already exists. Releases are never overwritten; pick the next version."
            fi

            awk -v head="## [$VERSION]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && !/^\[[^]]+\]: / { print }
            ' CHANGELOG.md > notes.md
            grep -q '[^[:space:]]' notes.md ||
              fail "CHANGELOG.md has no section \"## [$VERSION]\". Write it before releasing."

            if [ "$prerelease" = true ]; then
              images="$image:$VERSION"
            else
              app="$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' deploy/helm/xeronmx/Chart.yaml)"
              [ "$app" = "$VERSION" ] ||
                fail "deploy/helm/xeronmx/Chart.yaml has appVersion \"$app\"; set it (and version) to \"$VERSION\" first."
              IFS=. read -r major minor _ <<< "${VERSION%%-*}"
              images="$image:$VERSION"$'\n'"$image:$major.$minor"$'\n'"$image:latest"
            fi
            printf '\n---\n\nDocker image: `%s:%s`\n' "$image" "$VERSION" >> notes.md
          fi

          {
            echo "kind=$kind"
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "label=$label"
            echo "prerelease=$prerelease"
            echo "image=$image"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$short"
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Publishing $label ($kind)"
            echo
            echo "Commit: \`$GITHUB_SHA\`, pre-release: $prerelease"
            echo
            echo '```'
            echo "$images"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  check:
    name: Checks
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Build binaries
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.prepare.outputs.label }}
      DATE: ${{ needs.prepare.outputs.date }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the admin UI
        run: |
          rm -rf internal/ui/dist/assets internal/ui/dist/index.html
          cd web && npm ci --no-audit --no-fund && npm run build

      - name: Build and package
        run: |
          set -euo pipefail
          pkg=github.com/xeron-be/xeron-mx/internal/version
          ldflags="-s -w -X $pkg.Version=$LABEL -X $pkg.Commit=$COMMIT -X $pkg.Date=$DATE"
          mkdir -p dist

          build() {
            local name=$1 os=$2 arch=$3 ext=""
            [ "$os" = windows ] && ext=.exe
            local dir="$name-$LABEL-$os-$arch"
            mkdir -p "stage/$dir"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="$ldflags" \
              -o "stage/$dir/$name$ext" "./cmd/$name"
            cp LICENSE README.md "stage/$dir/"
            if [ "$os" = windows ]; then
              (cd stage && zip -qr "../dist/$dir.zip" "$dir")
            else
              tar -C stage -czf "dist/$dir.tar.gz" "$dir"
            fi
          }

          for arch in amd64 arm64; do
            build xeronmx linux "$arch"
          done
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              build xeronmxctl "$os" "$arch"
            done
          done

          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  image:
    name: Build and push the image
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.label }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.images }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.label }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish the GitHub release
    needs: [prepare, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: .

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ needs.prepare.outputs.kind }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        working-directory: dist
        run: |
          set -euo pipefail
          files=(*)

          if [ "$KIND" = edge ]; then
            gh release delete edge --yes --cleanup-tag || true
            gh release create edge "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Edge build (${GITHUB_SHA::7})" \
              --notes-file ../notes.md \
              --prerelease
          else
            flags=(--latest)
            [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "XeronMX $VERSION" \
              --notes-file ../notes.md \
              "${flags[@]}"
          fi
