name: CI

# Checks only: nothing here publishes anything. Pull requests run it directly;
# release.yml calls it before every build it publishes, which is what covers
# pushes to main.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the admin UI
        run: |
          rm -rf internal/ui/dist/assets internal/ui/dist/index.html
          cd web && npm ci --no-audit --no-fund && npm run build

      - name: Test the admin UI
        run: cd web && npm test

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Lint
        run: helm lint deploy/helm/xeronmx

      - name: Render and check against the config loader
        run: go test ./internal/config/ -run Helm -v

  # A pull request that breaks the Dockerfile should fail here rather than on
  # main. Releases build the image themselves, for every platform, so this only
  # runs for pull requests.
  docker:
    name: Docker image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
