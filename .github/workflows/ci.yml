name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the admin UI
        run: |
          rm -rf internal/ui/dist/assets internal/ui/dist/index.html
          cd web && npm ci --no-audit --no-fund && npm run build

      - name: Test the admin UI
        run: cd web && npm test

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Lint
        run: helm lint deploy/helm/xeronmx

      - name: Render and check against the config loader
        run: go test ./internal/config/ -run Helm -v

  drill:
    name: Outage drill (Postfix, crashes, 25 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build the daemon
        run: CGO_ENABLED=0 go build -trimpath -o bin/xeronmx ./cmd/xeronmx

      - name: Install swaks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swaks

      - name: Run the drill
        run: bash test/drill/run.sh

  docker:
    name: Docker image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
