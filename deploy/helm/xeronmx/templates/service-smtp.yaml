apiVersion: v1
kind: Service
metadata:
  name: {{ include "xeronmx.fullname" . }}-smtp
  labels:
    {{- include "xeronmx.labels" . | nindent 4 }}
  {{- with .Values.smtp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.smtp.service.type }}
  {{- if and (eq .Values.smtp.service.type "LoadBalancer") .Values.smtp.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.smtp.service.loadBalancerIP }}
  {{- end }}
  {{- with .Values.smtp.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and .Values.smtp.service.externalTrafficPolicy (ne .Values.smtp.service.type "ClusterIP") }}
  # Without Local, every sender appears to come from a cluster node. That breaks
  # per-source rate limiting, makes the received headers wrong, and leaves the
  # logs unable to answer who sent what.
  externalTrafficPolicy: {{ .Values.smtp.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "xeronmx.selectorLabels" . | nindent 4 }}
  ports:
    - name: smtp
      port: {{ .Values.smtp.service.port }}
      targetPort: smtp
      protocol: TCP
      {{- if .Values.smtp.service.nodePort }}
      nodePort: {{ .Values.smtp.service.nodePort }}
      {{- end }}
