{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "xeronmx.serviceAccountName" . }}
  labels:
    {{- include "xeronmx.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The daemon never calls the Kubernetes API, so it has no use for a token and
# mounting one would only be something for an attacker to find.
automountServiceAccountToken: false
{{- end }}
